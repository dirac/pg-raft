# Appended to the solo node's postgresql.conf by init.sh.

# ── Shared with ../raft/config.toml [pg_config] and ../std/postgresql.std.conf: keep them the same ──
shared_buffers     = 4GB
max_connections    = 200
max_wal_size       = 16GB
checkpoint_timeout = 15min

# ── WAL files: pg-raft forces wal_recycle = off and wal_init_zero = off (its FUSE layer needs
#    fresh segments, and zero-filling them through FUSE stalls commits). This setup keeps
#    PostgreSQL's defaults, the better choice without FUSE: recycled segments, zero-filled when
#    created. pg-raft forces wal_sync_method = fsync (FUSE sees fsync, not fdatasync); here
#    PostgreSQL's Linux default, fdatasync, which skips the file's metadata. ──
wal_sync_method    = fdatasync
wal_recycle        = on
wal_init_zero      = on
wal_level          = replica
fsync              = on
listen_addresses   = '*'

# ── No replication: a commit waits for the local flush only ──
synchronous_commit = on
