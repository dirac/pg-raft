# pg-raft cluster: 3 nodes and the proxy, all on this machine for now.
#
# Every node and the proxy read this same file. To spread the nodes over machines later, change
# each [[server]]'s hostname to that machine's address; ports can then be the same everywhere.
# `dir` and `backup_store` must exist on every machine (backup_store on the shared NFS mount).

dir          = "/data/testing/raft/data"        # node N lives in <dir>/node<N>
backup_store = "/mnt/efs/fs1/pg_raft/backups"   # shared by all nodes (NFS)
socket_dir   = "/tmp"                           # the WAL senders' Unix sockets

# Clients connect to the proxy: proxy_pg_port goes to the current primary, and
# proxy_pg_port + 1 + i to server i (5433..5435 here, so keep them free).
proxy_pg_port   = 5432
proxy_http_port = 8080   # admin: /health, /primary, /status (.json or .html)

# Backups are taken by a standby (pg_basebackup into backup_store) when a deadline passes:
# every backup_interval_secs, or every backup_wal_size bytes of WAL. The defaults (6 h, 4 GiB)
# would start a backup in the middle of a long pgbench run and skew it, so both are pushed out
# here; the cluster's first backup is written by init.sh. Lower them to test backups.
backup_interval_secs        = 86400
backup_wal_size             = 1099511627776   # 1 TiB
backup_pending_timeout_secs = 120

# Disk syncs on the commit path (read by each node at start). All off: a commit is durable once a
# majority has the WAL in its page cache, so durability comes from replication, and the kernel
# writes the pages back on its own. Only a power loss of a majority at once loses commits.
#   leader_sync    the leader msyncs its WAL (pg_wal and raft's copy) before the commit round
#   follower_sync  a follower msyncs the WAL it receives before acknowledging it
#   log_sync       the raft log (LMDB) is synced on every commit (off: MDB_NOSYNC, synced in the
#                  background within a second)
leader_sync   = false
follower_sync = false
log_sync      = false

# Lines for pg_hba.conf, written by init.sh ahead of pg-raft's defaults (the loopback is trusted,
# any other address asked for a scram-sha-256 password). With the proxy and pgbench on another
# machine, trust its network (the nodes replicate through raft, not PostgreSQL connections):
pg_hba = [
  # "host all all 10.0.0.0/16 trust",
]

[[server]]
hostname = "127.0.0.1"
pg_port  = 5441
ha_port  = 7001

[[server]]
hostname = "127.0.0.1"
pg_port  = 5442
ha_port  = 7002

[[server]]
hostname = "127.0.0.1"
pg_port  = 5443
ha_port  = 7003

# Written into postgresql.conf when the cluster is created (init.sh), so changes need a new
# cluster. Keep these the same as ../std/postgresql.std.conf. pg-raft adds wal_sync_method = fsync,
# wal_recycle = off, wal_level = replica, synchronous_commit = on, fsync = on.
# Values are written verbatim: quote anything with spaces as '...' inside the string.
[pg_config]
shared_buffers     = "4GB"
max_connections    = 200
max_wal_size       = "16GB"
checkpoint_timeout = "15min"
