# Appended to every std node's postgresql.conf by init.sh.

# ── Shared with ../raft/config.toml [pg_config]: keep them the same ──
shared_buffers     = 4GB
max_connections    = 200
max_wal_size       = 16GB
checkpoint_timeout = 15min

# ── WAL files: pg-raft forces wal_recycle = off and wal_init_zero = off (its FUSE layer needs
#    fresh segments, and zero-filling them through FUSE stalls commits). This setup keeps
#    PostgreSQL's defaults, the better choice without FUSE: recycled segments, zero-filled when
#    created. wal_sync_method = fdatasync, PostgreSQL's Linux default, as in pg-raft. ──
wal_sync_method    = fdatasync
wal_recycle        = on
wal_init_zero      = on
wal_level          = replica
fsync              = on
listen_addresses   = '*'

# ── Quorum sync replication: a commit waits for the primary and a majority's worth of standbys
#    to flush, the same durability as pg-raft's raft commit. init_primary.sh adds
#    synchronous_standby_names from the node count: 'ANY 1 (s1, s2)' for 3 nodes (2 of 3),
#    'ANY 2 (s1, s2, s3, s4)' for 5 (3 of 5). ──
synchronous_commit        = on
max_wal_senders           = 10
hot_standby               = on
