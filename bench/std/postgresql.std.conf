# Appended to every std node's postgresql.conf by init.sh.

# ── Shared with ../raft/config.toml [pg_config]: keep them the same ──
shared_buffers     = 4GB
max_connections    = 200
max_wal_size       = 16GB
checkpoint_timeout = 15min

# ── What pg-raft forces on its PostgreSQL (its FUSE layer needs them), matched here ──
wal_sync_method    = fsync
wal_recycle        = off
wal_level          = replica
fsync              = on
listen_addresses   = '*'

# ── Quorum sync replication: a commit waits for the primary and 1 of the 2 standbys to flush,
#    the same durability as pg-raft's 2-of-3 raft commit. ──
synchronous_commit        = on
synchronous_standby_names = 'ANY 1 (s1, s2)'
max_wal_senders           = 10
hot_standby               = on
